name: api.coach-staging.clickee.vn

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  CODENAME: thinklabsdev/clickee-coach-backend
  CURRENT_SERVICE: clickee-coach-backend
  SERVICE_TYPE: backend
  NAMESPACE: coach-staging
  TAG: ${{ github.run_id }}

jobs:
  install-build-and-push-job-to-k8s:
    name: Coach Staging Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to K8S
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAG }}

      - name: Build and push Job Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ env.CODENAME }}/${{ env.NAMESPACE }}/${{ env.CURRENT_SERVICE }}:latest,ghcr.io/${{ env.CODENAME }}/${{ env.NAMESPACE }}/${{ env.CURRENT_SERVICE }}:${{ env.TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ env.CODENAME }}/${{ env.NAMESPACE }}/${{ env.CURRENT_SERVICE }}:latest
          cache-to: type=inline

      - name: Render Deployment YAML
        uses: nowactions/envsubst@v1
        with:
          input: ./deployment/deployment.staging.yaml
          output: ./deployment/gen.deployment.staging.yaml

      - name: Apply to K8S
        run: |-
          kubectl apply -f ./deployment/gen.deployment.staging.yaml
          kubectl rollout status deployment/${CURRENT_SERVICE} -n ${NAMESPACE} --watch
